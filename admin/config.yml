backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "home"
    label: "Homepage"
    files:
      - name: "homepage"
        label: "Homepage Content"
        file: "data/home.json"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Hero Background Image", name: "backgroundImage", widget: "image", required: false }
              - { label: "Line 1", name: "line1", widget: "string" }
              - { label: "Line 2", name: "line2", widget: "string" }
              - { label: "Accent Line", name: "accent", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - { label: "Primary Button Text", name: "primaryButtonText", widget: "string" }
              - { label: "Primary Button Link", name: "primaryButtonLink", widget: "string" }
              - { label: "Secondary Button Text", name: "secondaryButtonText", widget: "string" }
              - { label: "Secondary Button Link", name: "secondaryButtonLink", widget: "string" }

          - label: "Services"
            name: "services"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Cards"
                name: "cards"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Link", name: "link", widget: "string" }
                  - { label: "Image", name: "image", widget: "image" }
                  - { label: "Icon", name: "icon", widget: "image", required: false }
                  - label: "Items"
                    name: "items"
                    widget: "list"
                    field: { label: "Item", name: "item", widget: "string" }

          - label: "Why Choose Us"
            name: "why"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - label: "Cards"
                name: "cards"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Text", name: "text", widget: "text" }

          - label: "Our Work"
            name: "work"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Images"
                name: "images"
                widget: "list"
                fields:
                  - { label: "Image", name: "image", widget: "image" }
                  - { label: "Alt Text", name: "alt", widget: "string" }
              - { label: "Button Text", name: "buttonText", widget: "string" }
              - { label: "Button Link", name: "buttonLink", widget: "string" }

  - name: "site_settings"
    label: "Site Settings"
    files:
      - name: "navigation"
        label: "Navigation"
        file: "data/site-settings.json"
        fields:
          - label: "Services Menu"
            name: "servicesMenu"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "Service Name", name: "label", widget: "string" }
              - { label: "Service URL", name: "url", widget: "string" }
          - label: "Projects Menu"
            name: "projectsMenu"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "Project Name", name: "label", widget: "string" }
              - { label: "Project URL", name: "url", widget: "string" }

  - name: "service_pages"
    label: "Service Pages"
    files:

      - name: "accent_walls"
        label: "Accent Walls Page"
        file: "data/accent-walls.json"
        fields:
          - label: "SEO"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Page Title", name: "title", widget: "string" }
              - { label: "Meta Description", name: "description", widget: "text" }

          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Hero Background Image", name: "backgroundImage", widget: "image", required: false }
              - { label: "Hero Title", name: "title", widget: "string" }
              - { label: "Hero Subtitle", name: "subtitle", widget: "text" }
              - { label: "Button Text", name: "buttonText", widget: "string" }
              - { label: "Button Link", name: "buttonLink", widget: "string" }
              - { label: "Scroll Target ID", name: "scrollTarget", widget: "string", required: false }

          - label: "Intro"
            name: "intro"
            widget: "object"
            fields:
              - { label: "Anchor ID", name: "anchorId", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Main Text", name: "mainText", widget: "text" }
              - { label: "Secondary Text", name: "secondaryText", widget: "text" }

              - label: "Intro Media Items"
                name: "mediaItems"
                widget: "list"
                required: false
                summary: "{{fields.type}} — {{fields.src}}"
                min: 1
                max: 2
                fields:
                  - label: "Type"
                    name: "type"
                    widget: "select"
                    default: "video"
                    options:
                      - { label: "Video", value: "video" }
                      - { label: "Image", value: "image" }
                  - label: "Source File"
                    name: "src"
                    widget: "file"
                    required: false
                    media_library:
                      config:
                        multiple: false
                  - { label: "Alt / Video Description", name: "alt", widget: "string", required: false }
                  - { label: "Autoplay", name: "autoplay", widget: "boolean", default: true, required: false }
                  - { label: "Loop", name: "loop", widget: "boolean", default: true, required: false }
                  - { label: "Show Controls", name: "controls", widget: "boolean", default: false, required: false }


          - label: "Types / Service Cards"
            name: "types"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Cards"
                name: "cards"
                widget: "list"
                fields:
                  - { label: "Card Title", name: "title", widget: "string" }
                  - { label: "Card Text", name: "text", widget: "text" }

          - label: "Process"
